extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

    resource_constant_labels:
      included:
        - service.name
        - service.version

  otlp/tempo:
    endpoint: tempo:4317

    tls:
      insecure: true

service:
  extensions:
    - health_check

  pipelines:
    metrics:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus

    traces:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlp/tempo
