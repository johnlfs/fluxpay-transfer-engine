apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: fluxpay
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP

    - name: management
      port: 15672
      targetPort: management
      protocol: TCP
