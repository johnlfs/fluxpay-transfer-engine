apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-worker
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: fluxpay-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fluxpay

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: fluxpay-worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxpay-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: fluxpay

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: fluxpay-worker:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          env:
            - name: DOTNET_ENVIRONMENT
              value: Production

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxpay-secrets
                  key: POSTGRES_PASSWORD

            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: RABBITMQ_HOST

            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: RABBITMQ_PORT

            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxpay-secrets
                  key: RABBITMQ_PASSWORD

            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: fluxpay-config
                  key: RABBITMQ_VHOST

          startupProbe:
            httpGet:
              path: /health/live
              port: http

            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http

            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http

            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 96Mi

            limits:
              cpu: 500m
              memory: 384Mi
