apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fluxpay
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
